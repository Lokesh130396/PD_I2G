function buildEmbed(){if(!S.pub)toast('Nothing published yet. The copy will show calling data only.');
const mk=r=>[r[0],String(r[1]).slice(-4),...r.slice(2)],B={viewer:true,cloudUrl:S.cloud.url,cloudView:S.cloud.view,builtAt:new Date().toISOString(),pub:S.pub,map:S.map,tg:S.tg,ds:S.ds.map(d=>({...d,rows:d.rows.map(mk)}))};
const tt=document.getElementById('toast');if(tt){tt.className='';tt.textContent=''}const keep=['#view','#bar','#nav'].map(q=>[q,$(q).innerHTML]);keep.forEach(([q])=>$(q).innerHTML='');
let h='<!DOCTYPE html>\n'+document.documentElement.outerHTML;keep.forEach(([q,v])=>$(q).innerHTML=v);
h=h.replace(new RegExp('<scr'+'ipt id="i2baked">[\\s\\S]*?<\\/scr'+'ipt>\\n?'),'').replace(/const SEED=\{.*\};/,"const SEED={id:'',label:'',days:1,sumTotal:0,rows:[]};");
const i=h.indexOf('<script src="https://cdnjs');h=h.slice(0,i)+'<scr'+'ipt id="i2baked">window.I2_BAKED='+JSON.stringify(B).replace(/</g,'\\u003c')+'<\/scr'+'ipt>\n'+h.slice(i);
dl('i2global-google-sites.html',h,'text/html');toast('Google Sites version downloaded. Paste it into Insert, Embed, Embed code.')}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
if(a==='tab'){S.tab=v;S.msg='';render()}else if(a==='lob'){S.lob=v;render()}else if(a==='sort'){S.dir=S.sort===t.dataset.k?-S.dir:-1;S.sort=t.dataset.k;render()}else if(a==='export')exportHTML();else if(a==='mexp')mapCsv();
else if(a==='rm'){if(!confirm('Remove this report from the dashboard?'))return;S.ds=S.ds.filter(d=>d.id!==t.dataset.id);LS.set('czds',S.ds);S.rep='all';render()}
else if(a==='adm'){if(S.admin)logout();else{S.tab='ta';S.msg='';render()}}else if(a==='login')login();else if(a==='pubv'){S.rvv=v;render()}else if(a==='sample'){S.sample=true;render()}else if(a==='nosample'){S.sample=false;render()}
else if(a==='publish'||a==='retrypub')publish();else if(a==='cl-test')clTest();else if(a==='cl-pull')clPull();else if(a==='cl-push')clPush();else if(a==='cl-hist')clHist();else if(a==='cl-restore')clRestore(t.dataset.id);else if(a==='bk-dl')bkDl();else if(a==='siteexp')buildEmbed();else if(a==='rptype'){S.rp.type=v;render()}else if(a==='genpdf')genPdf();else if(a==='resetpin'){if(confirm('Clear the admin PIN? Anyone holding this file can do this, so the PIN is a convenience lock, not security. Drafts are kept.')){LS.set('i2pin',null);S.msg='';render()}}else if(a==='rflob'){S.rf.lob=v;render()}else if(a==='rfreset'){S.rf={lob:'All',team:'All',rm:'All',st:'All',wk:'all'};render()}else if(a==='rvc'){S.rvc=v;render()}else if(a==='rvs'){S.rvs=v;render()}else if(a==='x-csv')xCsv();else if(a==='x-xlsx')xXlsx();else if(a==='x-print')window.print();else if(a==='x-png')xPng();else if(a==='x-copy')xCopy();else if(a==='copyx'){S.copy='';render()}else if(a==='rexp')revCsv();else if(a==='rclear'){if(!confirm('Clear all draft targets and achieved revenue for '+ymLabel(S.ym)+'? Published figures are not affected.'))return;delete S.draft.months[S.ym];LS.set('i2draft',S.draft);S.msg='Cleared '+ymLabel(S.ym)+' (draft only).';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pin'||e.target.id==='pin2'))login()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.a){adminEdit(t);keep()}
else if(d.cl){clSet(t)}else if(d.rp){setRp(t)}else if(d.rf){S.rf[d.rf]=t.value;render()}else if(d.f){S[d.f]=t.value;render()}
else if(d.m){const m=S.map[d.k]=S.map[d.k]||{};m[d.m]=d.m==='inc'?t.checked:t.value.trim();LS.set('czmap',S.map);render()}
else if(d.t){S.tg[d.t]=+t.value||S.tg[d.t];LS.set('cztg',S.tg);render()}
else if('merge' in d){S.merge=t.checked;LS.set('czmerge',S.merge);render()}
else if('wkt' in d){S.wk=t.checked;render()}
else if(t.id==='bkf'&&t.files[0])bkRestore(t.files[0]);else if(t.id==='pubf'&&t.files[0])loadPub(t.files[0]);else if(t.id==='xl'&&t.files[0])loadXlsx(t.files[0]);else if(t.id==='mimp'&&t.files[0])importMap(t.files[0]);else if(t.id==='rimp'&&t.files[0])importRev(t.files[0])});
/* Viewers get published figures from published.json next to this file; the admin's own browser also keeps the last publish. */
const pickMonth=p=>{if(!S.admin&&p&&!p.months[S.ym]){const k=Object.keys(p.months).sort();if(k.length)S.ym=k[k.length-1]}};pickMonth(S.pub);
(location.protocol==='file:'||BK.viewer?Promise.reject(0):fetch('published.json',{cache:'no-store'})).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.publishedAt&&j.months&&(!S.pub||j.publishedAt>S.pub.publishedAt)){S.pub=j;LS.set('i2pub',j);applyPubData(j);pickMonth(j);render()}}).catch(()=>{});
S.today=dk(new Date());setInterval(()=>{const k=dk(new Date());if(k!==S.today){S.today=k;render()}},6e4);
render();
</script>
<div id="toast" class=""></div></body></html>
